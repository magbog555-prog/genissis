# Genesis Foundation verify — B6 CI path
name: genesis-foundation-verify

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "04_CURSOR_WORKSPACES/01_C_UNIT_TEST_HELPER/**"
      - ".github/workflows/genesis-foundation-verify.yml"
  pull_request:
    paths:
      - "04_CURSOR_WORKSPACES/01_C_UNIT_TEST_HELPER/**"
      - ".github/workflows/genesis-foundation-verify.yml"

permissions:
  contents: read

jobs:
  foundation-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 04_CURSOR_WORKSPACES/01_C_UNIT_TEST_HELPER
    env:
      GENESIS_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: verify:foundation
        run: npm run verify:foundation
      - name: verify:portability-baseline
        run: npm run verify:portability-baseline
      - name: Write GitHub Actions CI proof (B6)
        if: success()
        run: node tools/verification/write-github-actions-ci-proof.mjs
      - name: Upload B6 CI proof artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: portability-baseline-ci-run
          path: 04_CURSOR_WORKSPACES/01_C_UNIT_TEST_HELPER/reports/portability-baseline-ci-run.json
          if-no-files-found: error
